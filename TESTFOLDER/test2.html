<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee KPI Cards</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <style>
        /* body {
            background: #f5f7fb;
            font-family: Arial, sans-serif;
        } */

        /* Horizontal scroll container */
        .kpi-wrapper {
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 8px 2px 15px;
            scrollbar-width: thin;
            scrollbar-color: #c5cbd3 transparent;
        }

        .kpi-container {
            display: flex;
            gap: 12px;
            width: max-content;
        }

        /* KPI Card */
        .kpi-card {
            width: 180px;
            min-width: 180px;
            height: 105px;
            background: #ffffff;
            border: 1px solid #e8ebef;
            border-radius: 10px;
            padding: 12px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease;
        }

        .kpi-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        .employee-icon {
            width: 35px;
            height: 35px;
            border-radius: 8px;
            background: #e8f1ff;
            color: #0d6efd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
            flex-shrink: 0;
        }

        .employee-name {
            font-size: 13px;
            font-weight: 600;
            color: #343a40;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .employee-label {
            font-size: 10px;
            color: #8a9199;
        }

        .hours {
            font-size: 20px;
            font-weight: 700;
            color: #212529;
            line-height: 1;
        }

        .hours-label {
            font-size: 10px;
            color: #8a9199;
        }

        /* Optional scrollbar styling */
        .kpi-wrapper::-webkit-scrollbar {
            height: 6px;
        }

        .kpi-wrapper::-webkit-scrollbar-track {
            background: transparent;
        }

        .kpi-wrapper::-webkit-scrollbar-thumb {
            background: #c5cbd3;
            border-radius: 10px;
        }

        .kpi-wrapper::-webkit-scrollbar-thumb:hover {
            background: #999;
        }
    </style>
</head>

<body>

<div class="container-fluid py-3">

    <div class="d-flex justify-content-between align-items-center mb-2">
        <h6 class="mb-0 fw-bold">Employee Timesheet</h6>
        <small class="text-muted">10 Employees</small>
    </div>

    <!-- Scrollable KPI Area -->
    <div class="kpi-wrapper">
        <div id="kpiContainer" class="kpi-container">
            <!-- Cards generated by JavaScript -->
        </div>
    </div>

</div>


<script>

    // Employee KPI data
    const employees = [
        {
            name: "John Smith",
            hours: 42
        },
        {
            name: "Sarah Wilson",
            hours: 38
        },
        {
            name: "Michael Brown",
            hours: 45
        },
        {
            name: "Emily Davis",
            hours: 40
        },
        {
            name: "David Miller",
            hours: 36
        },
        {
            name: "Jessica Taylor",
            hours: 41
        },
        {
            name: "Robert Anderson",
            hours: 44
        },
        {
            name: "Daniel Thomas",
            hours: 39
        },
        {
            name: "Sophia Martinez",
            hours: 37
        },
        {
            name: "James Wilson",
            hours: 43
        }
    ];


    // Get container
    const kpiContainer = document.getElementById("kpiContainer");


    // Loop through employees
    employees.forEach(employee => {

        const card = `
            <div class="kpi-card">

                <div class="d-flex align-items-center gap-2">

                    <!-- Bootstrap Person Icon -->
                    <div class="employee-icon">
                        <i class="bi bi-person-fill"></i>
                    </div>

                    <div class="flex-grow-1 min-width-0">

                        <div class="employee-label">
                            Employee
                        </div>

                        <div class="employee-name" title="${employee.name}">
                            ${employee.name}
                        </div>

                    </div>

                </div>

                <div class="d-flex align-items-end mt-2">

                    <div class="hours">
                        ${employee.hours}
                    </div>

                    <div class="hours-label ms-1 mb-1">
                        hrs
                    </div>

                </div>

            </div>
        `;

        kpiContainer.insertAdjacentHTML("beforeend", card);

    });

</script>

</body>
</html>
