<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Custom Time Input</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
.time-picker {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 1.5rem;
}

.time-box {
    width: 70px;
    text-align: center;
    font-weight: bold;
    border: 1px solid #ced4da;
    border-radius: 5px;
    padding: 8px;
    background-color: #fff;
}

.arrow-btns {
    display: flex;
    flex-direction: column;
}

.arrow-btns button {
    padding: 0;
    height: 20px;
    font-size: 12px;
}
</style>
</head>

<body class="p-5">

<div class="container">
    <h4 class="mb-3">Custom Time Picker</h4>

    <div class="time-picker">
        <!-- Hours -->
        <div class="text-center">
            <div class="arrow-btns">
                <button class="btn btn-light" onclick="changeHour(1)">▲</button>
                <input type="text" id="hour" class="time-box mt-1" >
                <button class="btn btn-light" onclick="changeHour(-1)">▼</button>
            </div>
            
        </div>

        <span>:</span>

        <!-- Minutes -->
        <div class="text-center">
            <div class="arrow-btns">
                <button class="btn btn-light" onclick="changeMinute(1)">▲</button>
                <input type="text" id="minute" class="time-box mt-1" >
                <button class="btn btn-light" onclick="changeMinute(-1)">▼</button>
            </div>
            
        </div>
    </div>

    <div class="mt-3">
        <strong>Selected Time:</strong>
        <span id="result"></span>
    </div>
</div>

<script>

    
// Initialize with current time
    let hourInput = document.getElementById("hour");
    let minuteInput = document.getElementById("minute");
    let result = document.getElementById("result");

    function initTime() {
        const now = new Date();
        hourInput.value = String(now.getHours()).padStart(2, "0");
        minuteInput.value = String(now.getMinutes()).padStart(2, "0");
        updateResult();
    }

    function changeHour(step) {
        let hour = parseInt(hourInput.value);
        hour = (hour + step + 24) % 24;
        hourInput.value = String(hour).padStart(2, "0");
        updateResult();
    }

    function changeMinute(step) {
        let minute = parseInt(minuteInput.value);
        minute = (minute + step + 60) % 60;
        minuteInput.value = String(minute).padStart(2, "0");
        updateResult();
    }

    function updateResult() {
        result.textContent = `${hourInput.value}:${minuteInput.value}`;
    }

    // Run on load
    initTime();
</script>

</body>
</html>
