      try {
        const pdfBytes = Uint8Array.from(atob(EMBEDDED_PDF_B64), c => c.charCodeAt(0)).buffer;
        const pdfDoc = await PDFLib.PDFDocument.load(pdfBytes);
        const form = pdfDoc.getForm();
        
        
        console.log("--- PDF Fields Found ---");
        const fields = form.getFields();
        fields.forEach(field => {
          console.log(`Field Name: ${field.getName()} | Type: ${field.constructor.name}`);
        });
        console.log("------------------");
      } catch (error) {
        console.error("Error reading PDF fields:", error);
      }
    }
